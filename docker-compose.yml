services:
  db:
    image: mysql:8.0
    container_name: sda_db
    environment:
      MYSQL_DATABASE: sdadk
      MYSQL_USER: sdadk
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "33872:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sda_backend
    restart: always
    ports:
      - "8872:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sdadk
      DB_USERNAME: sdadk
      DB_PASSWORD: "123456"
      APP_URL: http://localhost:8872
    depends_on:
      - db
    networks:
      - app_network
    volumes:
      - ./backend:/var/www/html

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sda_frontend
    restart: always
    ports:
      - "3872:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
